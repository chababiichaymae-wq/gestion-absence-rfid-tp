<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Étudiants | Smart TP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,sans-serif;background:#0f172a;color:white}

/* HEADER */
.topbar{
  height:60px;background:#020617;
  display:flex;align-items:center;padding:0 25px;
  color:#38bdf8;font-weight:bold;font-size:18px
}

/* LAYOUT */
.layout{display:flex}

/* SIDEBAR */
.sidebar{
  width:230px;background:#020617;min-height:100vh
}
.sidebar a{
  display:block;padding:14px 20px;color:#94a3b8;text-decoration:none
}
.sidebar a:hover,.sidebar .active{color:#38bdf8}

/* CONTENT */
.content{flex:1;padding:25px}
.header-content{
  display:flex;justify-content:space-between;align-items:center
}
.add{
  background:#22c55e;border:none;padding:10px 15px;border-radius:8px;cursor:pointer
}

/* FORM */
.form-container{
  display:none;margin-top:15px;background:#020617;padding:15px;border-radius:15px
}
.form-group{
  display:grid;grid-template-columns:150px 1fr;gap:8px;margin-bottom:8px;font-size:14px
}
.form-group input{
  padding:6px;border-radius:6px;border:none
}
.save-btn{
  background:#38bdf8;color:black;padding:8px 14px;border:none;border-radius:8px;margin-top:10px;cursor:pointer
}

/* CARD */
.card{
  background:#020617;border-radius:15px;padding:20px;display:flex;gap:20px;margin-top:15px;align-items:flex-start
}
.card img{
  width:120px;height:120px;border-radius:15px;object-fit:cover
}
.status{
  margin-left:auto;background:#22c55e;color:black;padding:6px 12px;border-radius:20px;height:fit-content
}
</style>
</head>

<body>

<header class="topbar">
  Smart TP Access & Attendance
</header>

<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">
  <a href="/dashboard"><i class="fa fa-chart-line"></i> Dashboard</a>
  <a href="/etudiants" class="active"><i class="fa fa-users"></i> Étudiants</a>
  <a href="/presences"><i class="fa fa-clock"></i> Présences</a>
  <a href="/absences"><i class="fa fa-user-xmark"></i> Absences</a>
  <a href="/emplois"><i class="fa fa-calendar"></i> Emplois</a>
  <a href="/salles"><i class="fa fa-desktop"></i> Salles</a>
</aside>

<!-- CONTENT -->
<main class="content">

<div class="header-content">
  <h2>🎓 Gestion des Étudiants</h2>
  <button class="add" onclick="toggleForm()">➕ Ajouter Étudiant</button>
</div>

<!-- FORMULAIRE AJOUT -->
<form id="studentForm" class="form-container" enctype="multipart/form-data">
  <div class="form-group"><span>Nom :</span><input name="nom" required></div>
  <div class="form-group"><span>Prénom :</span><input name="prenom" required></div>
  <div class="form-group"><span>CNE :</span><input name="cne" required></div>
  <div class="form-group"><span>Code RFID :</span><input name="code_rfid" required></div>
  <div class="form-group"><span>Filière :</span><input name="filiere" required></div>
  <div class="form-group"><span>Groupe :</span><input name="groupe" required></div>
  <div class="form-group"><span>N° Dossier :</span><input name="num_dossier" required></div>
  <div class="form-group"><span>Photo :</span><input type="file" name="photo"></div>
  <button type="submit" class="save-btn">Enregistrer Étudiant</button>
</form>

<!-- CARDS -->
<div id="cards"></div>

</main>
</div>

<!-- Axios -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
<script>
const container = document.getElementById("cards");
const form = document.getElementById("studentForm");

function toggleForm(){
    form.style.display = form.style.display === "none" ? "block" : "none";
}

// Afficher les étudiants
async function fetchStudents(){
    try{
        const res = await axios.get('/api/students');
        container.innerHTML = '';
        res.data.forEach(s=>{
            container.innerHTML += `
            <div class="card">
              <img src="${s.photo || 'https://via.placeholder.com/120'}">
              <div style="flex:1">
                <p>Nom: ${s.nom}</p>
                <p>Prénom: ${s.prenom}</p>
                <p>CNE: ${s.cne}</p>
                <p>Code RFID: ${s.code_rfid}</p>
                <p>Filière: ${s.filiere}</p>
                <p>Groupe: ${s.groupe}</p>
                <p>Dossier: ${s.num_dossier}</p>
              </div>
              <span class="status">ACTIF</span>
            </div>`;
        });
    }catch(err){ console.error(err); }
}

// Ajouter étudiant
form.addEventListener('submit', async function(e){
    e.preventDefault();
    const formData = new FormData(this);
    try{
        await axios.post('/api/add_student', formData);
        this.reset();
        form.style.display = "none";
        fetchStudents();
        alert("✅ Étudiant enregistré !");
    }catch(err){
        console.error(err);
        alert("❌ Erreur lors de l'ajout !");
    }
});

fetchStudents();
</script>

</body>
</html>
